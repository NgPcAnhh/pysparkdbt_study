name: 'pysparkdbt'
version: '1.0.0'

profile: 'pysparkdbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pysparkdbt:
    bronze:
      +materialized: table
      +schema: bronze

    silver:
      +materialized: incremental
      +schema: silver

    gold:
      +materialized: table
      +schema: gold

seeds:
  pysparkdbt:
    +schema: bronze
